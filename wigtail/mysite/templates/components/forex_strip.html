{% if forex_quotes %}
<section
    class="forex-strip{% if forex_strip_modifier %} forex-strip--{{ forex_strip_modifier }}{% endif %}"
    aria-label="Major FX pairs"
>
    <ul class="forex-strip__grid">
        {% for row in forex_quotes %}
            <li class="forex-strip__cell">
                <span class="forex-strip__pair">{{ row.label }}</span>
                <span class="forex-strip__mid">{{ row.mid_display }}</span>
            </li>
        {% endfor %}
    </ul>
</section>
{% endif %}
