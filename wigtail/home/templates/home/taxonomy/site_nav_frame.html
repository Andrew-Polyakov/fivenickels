{% load wagtailcore_tags taxonomy_tags %}

<turbo-frame
    id="site-nav"
    class="site-nav"
    data-turbo-action="advance"
    data-inline-chips
    data-create-url="{% url 'inline_create_taxonomy_term' %}"
    data-delete-url="{% url 'inline_delete_taxonomy_term' %}"
    data-rename-url="{% url 'inline_rename_taxonomy_term' %}"
    data-can-edit="{% if request.user.is_authenticated and request.user.is_staff or request.user.is_authenticated and request.user.is_superuser %}1{% else %}0{% endif %}"
>
    {% for row in nav_rows %}
        <nav class="site-nav__row site-nav__row--depth-{{ row.depth }}" aria-label="{% if row.depth == 1 %}Site sections{% else %}Subsections{% endif %}">
            <div
                data-taxonomy-chip-widget
                data-can-edit="{% if request.user.is_authenticated and request.user.is_staff or request.user.is_authenticated and request.user.is_superuser %}1{% else %}0{% endif %}"
                data-create-url="{% url 'inline_create_taxonomy_term' %}"
                data-delete-url="{% url 'inline_delete_taxonomy_term' %}"
                data-rename-url="{% url 'inline_rename_taxonomy_term' %}"
                {% if row.parent_id %}data-parent-id="{{ row.parent_id }}"{% endif %}
                {% if row.depth == 1 %}data-create-root="1"{% endif %}
                {% if row.depth == 1 and not trail_slugs %}data-after-create-visit="{% taxonomy_market_news_url home_page %}"{% endif %}
                data-placeholder="Add new"
                data-chips-json='[{% for term in row.nodes %}{% if term.link_page %}{"id":"{{ term.pk }}","name":"{{ term.name|escapejs }}","url":"{% pageurl term.link_page %}","active":{% if term.slug in trail_slugs or page and term.link_page_id == page.pk or page and page.section_term and page.section_term_id == term.id %}true{% else %}false{% endif %},"removable":true}{% else %}{% taxonomy_term_nav_url home_page trail_slugs row.depth term as nav_url %}{"id":"{{ term.pk }}","name":"{{ term.name|escapejs }}","url":"{{ nav_url|escapejs }}","active":{% if term.slug in trail_slugs or page and page.section_term and page.section_term_id == term.id %}true{% else %}false{% endif %},"removable":true}{% endif %}{% if not forloop.last %},{% endif %}{% endfor %}]'
            ></div>
            <div class="taxonomy-chip-widget__fallback" hidden>
                {% for term in row.nodes %}
                    {% if term.link_page %}
                        <a
                            href="{% pageurl term.link_page %}"
                            class="site-nav__link{% if term.slug in trail_slugs %} site-nav__link--active{% elif page and term.link_page_id == page.pk %} site-nav__link--active{% elif page and page.section_term and page.section_term_id == term.id %} site-nav__link--active{% endif %}"
                            data-site-nav-link="1"
                            data-turbo-frame="main"
                        >{{ term.name }}</a>
                    {% else %}
                        {% taxonomy_term_nav_url home_page trail_slugs row.depth term as nav_url %}
                        <a
                            href="{{ nav_url }}"
                            class="site-nav__link{% if term.slug in trail_slugs %} site-nav__link--active{% elif page and page.section_term and page.section_term_id == term.id %} site-nav__link--active{% endif %}"
                            data-site-nav-link="1"
                            data-turbo-frame="main"
                        >{{ term.name }}</a>
                    {% endif %}
                {% endfor %}
            </div>
        </nav>
    {% endfor %}
</turbo-frame>
