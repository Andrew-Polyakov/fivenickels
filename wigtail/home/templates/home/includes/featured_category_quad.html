<section class="markdown-tiles-section subsection-featured featured-category-quad" aria-label="Featured in this section">

    <h2 class="subsection-recent__heading">Featured</h2>

    <div
        class="featured-category-editor"
        data-inline-chips
        data-create-url="{% url 'inline_create_taxonomy_term' %}"
        data-delete-url="{% url 'inline_delete_taxonomy_term' %}"
        data-rename-url="{% url 'inline_rename_taxonomy_term' %}"
        data-can-edit="{% if request.user.is_authenticated and request.user.is_staff or request.user.is_superuser %}1{% else %}0{% endif %}"
        data-selected-parent-id="{% if featured_category_selected_term %}{{ featured_category_selected_term.pk }}{% endif %}"
    >
            {% if not taxonomy_active_node %}
                <nav class="featured-category-chips featured-category-chips--level" aria-label="Categories">
                    <div
                        data-taxonomy-chip-widget
                        data-can-edit="{% if request.user.is_authenticated and request.user.is_staff or request.user.is_superuser %}1{% else %}0{% endif %}"
                        data-create-url="{% url 'inline_create_taxonomy_term' %}"
                        data-delete-url="{% url 'inline_delete_taxonomy_term' %}"
                        data-rename-url="{% url 'inline_rename_taxonomy_term' %}"
                        {% if featured_category_parent_term %}data-parent-id="{{ featured_category_parent_term.pk }}"{% endif %}
                        data-placeholder="Add new"
                        data-chips-json='[{"id":"all","name":"All","url":"{{ request.path|escapejs }}","active":{% if not featured_category_selected %}true{% else %}false{% endif %},"removable":false}{% for term in featured_category_terms %},{"id":"{{ term.pk }}","name":"{{ term.name|escapejs }}","url":"{{ request.path|escapejs }}?category={{ term.slug|escapejs }}","active":{% if featured_category_selected == term.slug %}true{% else %}false{% endif %},"removable":true}{% endfor %}]'
                    ></div>
                </nav>

                {% if featured_category_selected_term %}
                    <nav class="featured-category-chips featured-category-chips--sublevel" aria-label="Subcategories">
                        <div
                            data-taxonomy-chip-widget
                            data-can-edit="{% if request.user.is_authenticated and request.user.is_staff or request.user.is_superuser %}1{% else %}0{% endif %}"
                            data-create-url="{% url 'inline_create_taxonomy_term' %}"
                            data-delete-url="{% url 'inline_delete_taxonomy_term' %}"
                            data-rename-url="{% url 'inline_rename_taxonomy_term' %}"
                            data-parent-id="{{ featured_category_selected_term.pk }}"
                            data-placeholder="Add new"
                            data-chips-json='[{% for term in featured_category_child_terms %}{"id":"{{ term.pk }}","name":"{{ term.name|escapejs }}","url":"{{ request.path|escapejs }}?category={{ term.slug|escapejs }}","active":{% if featured_category_selected == term.slug %}true{% else %}false{% endif %},"removable":true}{% if not forloop.last %},{% endif %}{% endfor %}]'
                        ></div>
                    </nav>
                {% endif %}
            {% endif %}
    </div>

    <div class="big-tile-panel big-tile-panel--quad">

        <div class="big-tile-quad__grid">

            {% for p in featured_quad_pages %}

                <div class="big-tile-quad__cell">

                    {% if p %}

                        {% include "home/includes/page_tile_card.html" with page=p %}

                    {% else %}

                        <div class="big-tile-panel__empty" role="status">No article.</div>

                    {% endif %}

                </div>

            {% endfor %}

        </div>

    </div>

</section>
