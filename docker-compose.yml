# Start OpenSearch (for Wagtail full-text search): docker compose up -d opensearch
# Then set WAGTAIL_USE_OPENSEARCH=1 and optionally WAGTAIL_OPENSEARCH_URL=http://127.0.0.1:9200
# Run from wigtail/: python manage.py update_index
services:
  postgres:
    image: postgres:16-alpine
    container_name: trades-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: trades
      POSTGRES_PASSWORD: trades
      # Admin DB only; app DBs (wagtail, crawler) are provisioned by
      # db/init/01-create-databases.sql on first container start.
      POSTGRES_DB: postgres
    volumes:
      - trades_pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trades -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  opensearch:
    image: opensearchproject/opensearch:2.17.1
    container_name: trades-opensearch
    ports:
      - "9200:9200"
      - "9600:9600"
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=false
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - trades_osdata:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

volumes:
  trades_pgdata:
  trades_osdata:
