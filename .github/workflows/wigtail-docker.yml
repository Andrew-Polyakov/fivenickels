name: Wigtail Docker build

on:
  push:
    paths:
      - "wigtail/**"
      - "front-end/**"
      - ".dockerignore"
      - ".do/**"
      - ".github/workflows/wigtail-docker.yml"
  pull_request:
    paths:
      - "wigtail/**"
      - "front-end/**"
      - ".dockerignore"
      - ".do/**"
      - ".github/workflows/wigtail-docker.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wigtail
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run deployment-related tests
        env:
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        run: >-
          python manage.py test
          home.tests_health
          mysite.settings.tests_database_url
          mysite.settings.tests_spaces_storage
          mysite.settings.tests_production_hosts
          --verbosity=1

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build production image
        run: docker build -f wigtail/Dockerfile -t trades-wigtail:ci .
