<section class="ticker-shell">
  <h2>Feature Ticker</h2>
  <div class="ticker-track">
    @for (stock of stocks; track trackBySymbol($index, stock)) {
      <button
        type="button"
        class="ticker-item"
        [class.selected]="selectedSymbol === stock.symbol"
        (click)="select(stock.symbol)">
        <strong>{{ stock.symbol }}</strong>
        <span>{{ stock.name || 'Unknown' }}</span>
        <small>{{ stock.exchange || 'N/A' }}</small>
      </button>
    }
    @if (stocks.length === 0) {
      <p class="empty">No stocks available.</p>
    }
  </div>
</section>
